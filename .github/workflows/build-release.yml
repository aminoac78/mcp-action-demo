name: Build and Release ONNX Runtime WebGPU

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip python3-dev cmake ninja-build libprotobuf-dev protobuf-compiler

      - name: Clone ONNX Runtime
        run: |
          git clone --recursive https://github.com/microsoft/onnxruntime.git onnxruntime_src

      - name: Build ONNX Runtime with WebGPU for Linux ARM64
        run: |
          cd onnxruntime_src
          python3 tools/ci_build/build.py \
            --build_dir build \
            --config Release \
            --build_shared_lib \
            --use_webgpu \
            --skip_tests \
            --parallel $(nproc)

      - name: Package Artifacts
        run: |
          mkdir -p pkg/include pkg/lib
          cp -r onnxruntime_src/include/onnxruntime/core/session/*.h pkg/include/ 2>/dev/null || true
          cp -r onnxruntime_src/include/onnxruntime/core/providers/webgpu/*.h pkg/include/ 2>/dev/null || true
          find onnxruntime_src/build/Release -maxdepth 2 -name "*.so" -exec cp {} pkg/lib/ \;
          find onnxruntime_src/build/Release -maxdepth 2 -name "*.a" -exec cp {} pkg/lib/ \;
          mkdir -p dist
          tar -czf dist/onnxruntime-linux-arm64-webgpu.tar.gz -C pkg .

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-linux-arm64-webgpu
          path: dist/onnxruntime-linux-arm64-webgpu.tar.gz

  build-android-arm64:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.7
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          apt-get update && apt-get install -y ninja-build build-essential

      - name: Clone ONNX Runtime
        run: |
          git clone --recursive https://github.com/microsoft/onnxruntime.git onnxruntime_src

      - name: Build ONNX Runtime with WebGPU for Android ARM64-v8a
        run: |
          cd onnxruntime_src
          export ANDROID_NDK_HOME=/opt/android-ndk-r29
          export ANDROID_SDK_ROOT=/opt/android/sdk
          mkdir -p $ANDROID_SDK_ROOT
          python3 tools/ci_build/build.py \
            --build_dir build \
            --config Release \
            --android \
            --build_shared_lib \
            --android_sdk_path $ANDROID_SDK_ROOT \
            --android_ndk_path $ANDROID_NDK_HOME \
            --android_abi arm64-v8a \
            --android_api 28 \
            --use_webgpu \
            --skip_tests \
            --allow_running_as_root \
            --cmake_generator Ninja \
            --parallel $(nproc)

      - name: Package Android Artifacts
        run: |
          mkdir -p pkg/include pkg/lib
          cp -r onnxruntime_src/include/onnxruntime/core/session/*.h pkg/include/ 2>/dev/null || true
          cp -r onnxruntime_src/include/onnxruntime/core/providers/webgpu/*.h pkg/include/ 2>/dev/null || true
          find onnxruntime_src/build/Release -maxdepth 2 -name "*.so" -exec cp {} pkg/lib/ \;
          find onnxruntime_src/build/Release -maxdepth 2 -name "*.a" -exec cp {} pkg/lib/ \;
          mkdir -p dist
          tar -czf dist/onnxruntime-android-arm64v8a-webgpu.tar.gz -C pkg .

      - name: Upload Android ARM64v8a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-android-arm64v8a-webgpu
          path: dist/onnxruntime-android-arm64v8a-webgpu.tar.gz

  release:
    needs: [build-linux-arm64, build-android-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/onnxruntime-linux-arm64-webgpu/*.tar.gz
            artifacts/onnxruntime-android-arm64v8a-webgpu/*.tar.gz
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
